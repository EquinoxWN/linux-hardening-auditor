[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-hardening-auditor"
version = "0.1.0"
description = "Audit Linux hosts against CIS-style controls written as YAML rules, from a file tree, the local host or over SSH."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[project.scripts]
lha = "linux_hardening_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linux_hardening_auditor = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live'"
timeout = 120
markers = [
    "live: audits the real host it runs on (Linux CI only, never run locally)",
]

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF", "BLE", "E722"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]
